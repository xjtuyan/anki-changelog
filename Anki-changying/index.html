<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="长缨记忆卡 —— 专业 Anki 牌组展示、更新日志与勘误中心。科学记忆，持续迭代，勘误透明。">
  <title>长缨记忆卡 · 专业 Anki 牌组与更新勘误中心</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml">
  <!-- docsify 主题（本地 vendor，不依赖外部 CDN，国内稳定） -->
  <link rel="stylesheet" href="./vendor/vue.css">
  <style>
    :root {
      /* 品牌红（呼应 logo），苹果风留白与中性灰 */
      --brand: #c0392b;
      --brand-dark: #a93226;
      --bg: #fbfbfd;
      --surface: #ffffff;
      --text: #1d1d1f;
      --gray: #86868b;
      --line: #e5e5ea;
      --radius: 18px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
      --shadow: 0 10px 30px rgba(0,0,0,.09);
      --shadow-lg: 0 18px 44px rgba(192,57,43,.16);
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .app-name-link { font-weight: 700; letter-spacing: .3px; }

    /* 顶部导航：苹果风毛玻璃 */
    .navbar {
      background: rgba(251,251,253,.82) !important;
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--line) !important;
      box-shadow: none !important;
    }
    .navbar .link, .navbar-brand { color: var(--text) !important; font-weight: 500; }
    .navbar .link:hover, .navbar-brand:hover { color: var(--brand) !important; }

    /* 侧边栏 */
    .sidebar { background: var(--surface); border-right: 1px solid var(--line); }
    .sidebar-nav a, .sidebar li > a { color: #333 !important; border-radius: 8px; }
    .sidebar-nav a:hover, .sidebar li > a:hover { color: var(--brand) !important; background: rgba(192,57,43,.05); }
    .sidebar-nav a.active { color: var(--brand) !important; font-weight: 700; }

    /* 正文排版 */
    .markdown-section { max-width: 1040px; padding: 44px 32px 80px; }
    .markdown-section h1, .markdown-section h2 { border: none; font-weight: 700; letter-spacing: -.02em; color: var(--text); }
    .markdown-section h1 { font-size: 34px; }
    .markdown-section h2 { font-size: 26px; margin-top: 40px; }
    .markdown-section h3 { font-size: 19px; color: #333; }
    .markdown-section p { color: #333; }
    .markdown-section a { color: var(--brand); font-weight: 500; }
    .markdown-section hr { border: none; border-top: 1px solid var(--line); margin: 32px 0; }
    .markdown-section blockquote {
      border-left: 3px solid var(--brand); color: #555; background: #fdf6f5;
      border-radius: 0 10px 10px 0; padding: 12px 18px;
    }

    /* 封面 Hero（苹果风） */
    .cover { bottom: 0 !important; background: radial-gradient(1200px 420px at 50% -12%, rgba(192,57,43,.10), transparent 70%) !important; }
    .cover-main { padding-top: 56px; }
    .cover-main img { max-width: 240px; margin-bottom: 6px; }
    .cover-main h1 { font-size: clamp(34px, 5vw, 56px) !important; font-weight: 800; letter-spacing: -.03em; color: var(--text); margin: 12px 0 6px; }
    .cover-main p { font-size: 19px; color: var(--gray); max-width: 640px; margin: 0 auto 6px; }
    /* 封面按钮 */
    .cover-main a[href] {
      display: inline-block; margin: 10px 8px 0; padding: 12px 30px;
      border-radius: 980px; font-weight: 600; font-size: 16px; text-decoration: none; transition: .2s;
    }
    .cover-main a[href]:first-of-type { background: var(--brand); color: #fff !important; box-shadow: var(--shadow); }
    .cover-main a[href]:first-of-type:hover { background: var(--brand-dark); transform: translateY(-2px); }
    .cover-main a[href]:not(:first-of-type) { background: #fff; color: var(--brand) !important; border: 1.5px solid var(--brand); }
    .cover-main a[href]:not(:first-of-type):hover { background: rgba(192,57,43,.06); }

    /* 价值点四宫格 */
    .feature-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 18px; margin: 26px 0; }
    .feature-row .f { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow-sm); transition: .2s; }
    .feature-row .f:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
    .feature-row .f strong { color: var(--text); }

    /* 产品分类标签 */
    .deck-category { font-size: 13px; font-weight: 700; color: var(--gray); letter-spacing: .12em; text-transform: uppercase; margin: 30px 0 14px; }

    /* 产品卡片（仿 ankistudio ptabs-product-card） */
    .deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 20px; margin: 0 0 6px; }
    .product-card {
      position: relative; background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow-sm);
      transition: transform .2s, box-shadow .2s; display: flex; flex-direction: column;
    }
    .product-card:hover { transform: translateY(-6px); box-shadow: var(--shadow); }
    .product-card .pct-icon { font-size: 30px; margin-bottom: 8px; }
    .product-card h3 { margin: 0 0 4px; font-size: 19px; color: var(--text); }
    .product-card .meta { font-size: 13px; color: var(--gray); margin-bottom: 10px; }
    .product-card .desc { font-size: 14px; color: #444; line-height: 1.65; flex: 1; }
    .product-card .price { margin-top: 12px; font-size: 18px; font-weight: 700; color: var(--text); }
    .product-card .price small { font-size: 12px; color: var(--gray); font-weight: 400; }
    .product-card .actions { margin-top: 14px; }
    .product-card .actions a {
      display: inline-block; padding: 9px 20px; border-radius: 980px;
      background: var(--brand); color: #fff !important; font-weight: 600; text-decoration: none; font-size: 14px; transition: .2s;
    }
    .product-card .actions a:hover { background: var(--brand-dark); transform: translateY(-1px); }

    /* 入口/预览小卡 */
    .mini-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap: 20px; margin: 18px 0; }
    .mini-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow-sm); transition: .2s; }
    .mini-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
    .mini-card .ico { font-size: 26px; }
    .mini-card h3 { margin: 8px 0; color: var(--brand); }
    .mini-card p { color: #555; font-size: 14px; margin: 0 0 10px; }
    .mini-card a { color: var(--brand); font-weight: 600; text-decoration: none; }

    /* 徽标 */
    .tag { display: inline-block; padding: 2px 10px; border-radius: 980px; font-size: 12px; font-weight: 700; vertical-align: middle; margin-left: 6px; }
    .tag-up { background: rgba(39,174,96,.14); color: #1e8a4c; }
    .tag-fix { background: rgba(192,57,43,.12); color: var(--brand); }
    .tag-deck { background: rgba(41,128,185,.14); color: #2471a3; }
    .tag-hot { background: rgba(192,57,43,.10); color: var(--brand); }
    .tag-new { background: rgba(39,174,96,.16); color: #1e8a4c; }

    /* 分页条 */
    .pagination-item { border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <div id="app">正在加载…</div>

  <script>
    window.$docsify = {
      relativePath: true,             // 兼容 GitHub Pages / Cloudflare 子路径部署
      name: '长缨记忆卡',
      repo: '',
      homepage: 'README.md',
      coverpage: true,                // 启用封面页（品牌 Hero）
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      maxLevel: 4,
      notFoundPage: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索牌组 / 更新 / 勘误…',
        noData: '找不到结果',
        depth: 4
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      }
    };
  </script>

  <!-- docsify 核心（本地 vendor） -->
  <script src="./vendor/docsify.min.js"></script>
  <script src="./vendor/search.min.js"></script>
  <script src="./vendor/docsify-pagination.min.js"></script>
  <script src="./vendor/docsify-copy-code.min.js"></script>
</body>
</html>
