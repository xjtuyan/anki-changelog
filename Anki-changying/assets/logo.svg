<svg xmlns="http://www.w3.org/2000/svg" width="248" height="60" viewBox="0 0 248 60">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e74c3c"/>
      <stop offset="1" stop-color="#c0392b"/>
    </linearGradient>
  </defs>
  <!-- emblem 56x56 -->
  <g transform="translate(2,2)">
    <rect x="8" y="14" width="40" height="38" rx="11" fill="url(#red)"/>
    <rect x="8" y="14" width="40" height="20" rx="11" fill="#ef5b4c" opacity="0.55"/>
    <!-- tassel knot (长缨) -->
    <circle cx="28" cy="9" r="5.5" fill="#f1c40f"/>
    <path d="M28 14 C 24 22, 23 26, 22 32" stroke="#f1c40f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M28 14 C 28 22, 28 28, 28 34" stroke="#f1c40f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M28 14 C 32 22, 33 26, 34 32" stroke="#f1c40f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- card pins -->
    <rect x="18" y="42" width="4" height="7" rx="2" fill="#ffffff" opacity="0.92"/>
    <rect x="26" y="42" width="4" height="7" rx="2" fill="#ffffff" opacity="0.92"/>
    <rect x="34" y="42" width="4" height="7" rx="2" fill="#ffffff" opacity="0.92"/>
  </g>
  <!-- wordmark -->
  <text x="70" y="30" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="26" font-weight="700" fill="#c0392b">长缨记忆卡</text>
  <text x="71" y="48" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10" letter-spacing="2" fill="#999999">CHANGYING MEMORY CARDS</text>
</svg>
